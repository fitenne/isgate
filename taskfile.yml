version: "3"

tasks:
  default:
    desc: Build the application
    cmds:
      - task: templ-generate
      - task: build-frontend
      - go build -o isgate .

  image:
    cmds:
      - task: default
      - podman build -t isgate:dev -f Dockerfile .

  templ-generate:
    cmds:
      - templ generate webapp
    sources:
      - "webapp/**/*.templ"
    generates:
      - "webapp/**/*_templ.go"

  build-frontend:
    dir: webapp
    cmds:
      - nub install
      - nub run build
    sources:
      - "src/**/*"
      - "public/**/*"
    generates:
      - "dist/**/*"

  upload:
    cmds:
      - podman save --format oci-archive isgate:dev | zstd -c | ssh -4 {{.CLI_ARGS}} 'zstd -d -c | nerdctl load && nerdctl tag localhost/isgate:dev isgate:dev && nerdctl rmi localhost/isgate:dev'
